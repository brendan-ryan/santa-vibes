name: Deploy to VPS

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            cd /var/www/santa-vibes
            git pull origin main
            npm ci
            npx prisma migrate deploy
            npm run build
            pm2 restart santa-vibes --update-env || pm2 start npm --name santa-vibes --cwd /var/www/santa-vibes -- start
